<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff5f00">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- FEHÉR VILLANÁST GÁTLÓ SCRIPT -->
    <script>if(localStorage.getItem('theme')==='dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.body.classList.add('dark-mode');</script>

    <main class="container" style="padding-top: 80px; padding-bottom: 80px;">
        
        <!-- 1. FEJLESZTŐI TESZT MÓD -->
        <div class="minimal-card mb-4" style="border: 1px solid var(--primary);">
            <h5 class="fw-bold mb-1 text-primary d-flex align-items-center gap-2">
                <span>🧪</span> Saját Teszt Szerepkör
            </h5>
            <p class="small text-muted mb-3">Válts át ideiglenesen egy másik rangra a saját eszközödön a csempék és védelem teszteléséhez.</p>
            
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary btn-sm flex-grow-1" onclick="simulateRole('operator')">Operátor</button>
                <button class="btn btn-outline-warning btn-sm flex-grow-1" onclick="simulateRole('leader')">Csoportvezető</button>
                <button class="btn btn-outline-primary btn-sm flex-grow-1 fw-bold" onclick="simulateRole('admin')">Admin</button>
            </div>
            <div class="mt-2 text-center small text-muted">
                Jelenlegi helyi rangod: <strong id="currentLocalRoleDisplay" class="text-uppercase text-primary">-</strong>
            </div>
        </div>

        <!-- 2. FELHASZNÁLÓK KEZELÉSE (FIREBASE) -->
        <div class="minimal-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0 d-flex align-items-center gap-2">
                    <span>👥</span> Regisztrált Felhasználók
                </h5>
                <button class="btn btn-sm btn-light" onclick="loadAdminUsers()">🔄</button>
            </div>
            
            <p class="small text-muted mb-4">A csarnok dolgozóinak központi jogosultságkezelése.</p>

            <!-- Ide töltődnek be a kollégák a Firebase-ből -->
            <div id="userAdminList" class="d-flex flex-column gap-2">
                <div class="text-center text-muted small py-3">Felhasználók betöltése...</div>
            </div>
        </div>

    </main>

    <!-- SAJÁT ALSÓ MENÜ -->
    <nav class="bottom-nav">
        <button onclick="window.location.href='index.html'"><span class="nav-ico">🏠</span>Kezdőlap</button>
        <button onclick="window.location.href='ic-generator.html'"><span class="nav-ico">⚡</span>Gen</button>
        <button class="active" onclick="window.location.href='admin.html'"><span class="nav-ico">🗂️</span>Admin</button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
