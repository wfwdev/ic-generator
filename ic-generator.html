<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IC Generator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff5f00">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <script>if(localStorage.getItem('theme')==='dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.body.classList.add('dark-mode');</script>

    <main class="container" style="padding-top: 80px; padding-bottom: 80px;">
        <div id="tab-generator">
            <div class="minimal-card">
                <div class="pill-nav mb-4"><button class="active" onclick="switchType('ESS')">ESS</button><button onclick="switchType('WSS')">WSS</button></div>
                <div class="mb-3"><label class="form-label small fw-bold">IC kiválasztása</label><select id="genSelect" class="form-select form-select-lg"></select></div>
                <div class="mb-4"><label class="form-label small fw-bold">Mennyiség (Max 5000)</label><input type="number" id="genAmount" class="form-control form-control-lg" placeholder="Pl. 1500" inputmode="numeric"></div>
                <button class="btn btn-primary btn-lg w-100" onclick="generateData()">Generálás</button>
            </div>
        </div>

        <div id="tab-admin" class="hidden">
            <div class="minimal-card">
                <h5 class="fw-bold mb-3">IC Adatbázis</h5>
                <div id="adminList" class="list-group list-group-flush"></div>
                <button class="btn btn-outline-primary mt-4 w-100" style="border-style:dashed" onclick="openIcModal()">+ Új IC rögzítése</button>
            </div>
        </div>

        <div id="tab-stat" class="hidden">
            <div class="minimal-card">
                <h5 class="fw-bold mb-4">📊 Műszerfal</h5>
                <div class="p-3 mb-4 rounded" style="background: var(--sur2); border: 1px solid var(--bord);">
                    <h6 class="text-primary mb-3 fw-bold">⚡ Mai aktivitás</h6>
                    <div class="row text-center"><div class="col-6 border-end"><div class="text-muted small">Generálások</div><strong class="fs-3" id="statDayCount">0</strong></div><div class="col-6"><div class="text-muted small">Készült darab</div><strong class="fs-3" id="statDayAmount">0 db</strong></div></div>
                </div>
                <div class="p-3 rounded" style="background: var(--sur2); border: 1px solid var(--bord);">
                    <h6 class="text-primary mb-3 fw-bold">🌍 Teljes élettartam</h6>
                    <div class="text-center"><div class="text-muted small">Összes generálás</div><strong class="fs-3" id="statAllCount">0</strong></div>
                </div>
            </div>
        </div>
    </main>

    <div class="qr-fullscreen hidden" id="qrFullscreen"><div class="qr-scroll-area"><div class="qr-large-box"><div id="q1-large"></div><div class="qr-label mt-3 fs-6" id="q1-text"></div></div><div class="qr-large-box"><div id="q2-large"></div><div class="qr-label mt-3 fs-6" id="q2-text"></div></div></div><div class="qr-footer"><button class="btn btn-primary w-100 btn-lg" onclick="closeQr()">Bezárás</button></div></div>
    
    <div class="overlay" id="icModal"><div class="modal-custom"><h4 class="fw-bold mb-4">IC Kezelés</h4><div class="mb-3"><label class="form-label">Terület</label><select id="imType" class="form-select"><option value="ESS">ESS</option><option value="WSS">WSS</option></select></div><div class="mb-4"><label class="form-label">IC Száma</label><input type="text" id="imCode" class="form-control" style="text-transform: uppercase;"></div><div class="d-flex gap-2"><button class="btn btn-danger" id="imDel" onclick="deleteIc()" style="display:none">Törlés</button><button class="btn btn-light flex-grow-1" onclick="document.getElementById('icModal').classList.remove('open')">Mégsem</button><button class="btn btn-primary flex-grow-1" onclick="saveIc()">Mentés</button></div></div></div>

    <nav class="bottom-nav">
        <button onclick="window.location.href='index.html'"><span class="nav-ico">🏠</span>Kezdőlap</button>
        <button class="active" onclick="showTab('generator')"><span class="nav-ico">⚡</span>Gen</button>
        <button onclick="showTab('admin')"><span class="nav-ico">🗂️</span>Admin</button>
        <button onclick="showTab('stat')"><span class="nav-ico">📊</span>Stat</button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/ic.js"></script>
</body>
</html>
