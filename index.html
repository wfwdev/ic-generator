<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Műszak App</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff5f00">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>if(localStorage.getItem('theme')==='dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.body.classList.add('dark-mode');</script>

    <main class="container" style="padding-top: 80px;">
        <h5 class="fw-bold mb-4">Kezdőlap</h5>
        <div class="dashboard-grid">
            <div class="dashboard-tile tile-orange" onclick="window.location.href='ic-generator.html'">
                <div class="tile-icon">⚡</div><div class="tile-title">IC-generator</div><div class="tile-desc">Nyersanyag azonosítók</div>
            </div>
            <div class="dashboard-tile tile-blue" onclick="checkAndGo('mes-terminal.html')">
                <div class="tile-icon">💻</div><div class="tile-title">MES terminál</div><div class="tile-desc">Gyors belépés (QR)</div>
            </div>
            <div class="dashboard-tile tile-green" onclick="checkAndGo('pack-code.html')">
                <div class="tile-icon">📦</div><div class="tile-title">Csomagoló kód</div><div class="tile-desc">Csomagoló azonosítók</div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <button onclick="checkAndGo('admin.html')"><span class="nav-ico">🗂️</span>Admin</button>
        <button onclick="checkAndGo('info.html')"><span class="nav-ico">ℹ️</span>Infó</button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
