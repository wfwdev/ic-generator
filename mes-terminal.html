<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MES Terminál</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff5f00">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- QR kód generáló könyvtár -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <!-- FEHÉR VILLANÁST GÁTLÓ SCRIPT -->
    <script>if(localStorage.getItem('theme')==='dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.body.classList.add('dark-mode');</script>

    <main class="container" style="padding-top: 80px; padding-bottom: 80px;">
        
        <div class="minimal-card mb-4">
            <h5 class="fw-bold mb-1 d-flex align-items-center gap-2">
                <span style="font-size: 1.5rem;">💳</span> Virtuális Belépőkártya
            </h5>
            <p class="small text-muted mb-4">A gépbejelentkező adataidat csak a te telefonod tárolja, maximális biztonságban.</p>
            
            <div class="mb-3">
                <label class="form-label small fw-bold">MES Felhasználónév</label>
                <input type="text" id="mesUser" class="form-control form-control-lg" placeholder="Pl. kovacs.gabor">
            </div>
            
            <div class="mb-4">
                <label class="form-label small fw-bold">MES Jelszó</label>
                <!-- Type="password" hogy ne lássák a válla felett -->
                <input type="password" id="mesPass" class="form-control form-control-lg" placeholder="********">
            </div>
            
            <div class="d-flex gap-2">
                <button class="btn btn-light flex-grow-1" onclick="saveMesData()">💾 Adatok mentése</button>
                <button class="btn btn-primary flex-grow-1" onclick="generateMesQr()">Bejelentkezés ⚡</button>
            </div>
        </div>

        <!-- A GENERÁLT QR KÓD HELYE (Alapból rejtett) -->
        <div id="mesQrContainer" class="minimal-card text-center hidden" style="border: 2px dashed var(--primary); background: var(--sur2);">
            <p class="fw-bold text-primary mb-3">Csippantsd le a terminálnál!</p>
            
            <!-- Ide kerül a QR kód -->
            <div id="mesQrOutput" class="d-flex justify-content-center bg-white p-3 rounded mx-auto mb-3" style="width: 250px; height: 250px;"></div>
            
            <p class="small text-muted mb-0">Ez az egy kód tartalmazza a Neved, a TAB ugrást és a Jelszavadat + Entert is!</p>
        </div>
        
    </main>

    <!-- SAJÁT ALSÓ MENÜ -->
    <nav class="bottom-nav">
        <button onclick="window.location.href='index.html'"><span class="nav-ico">🏠</span>Kezdőlap</button>
        <button class="active" onclick="window.location.href='mes-terminal.html'"><span class="nav-ico">💻</span>Terminál</button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="app.js"></script>
    
    <!-- MES TERMINÁL SPECIFIKUS LOGIKA -->
    <script>
        // Amikor betölt az oldal, beírjuk a már elmentett adatokat a mezőkbe
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('mesUser').value = localStorage.getItem('mesData_user') || '';
            document.getElementById('mesPass').value = localStorage.getItem('mesData_pass') || '';
        });

        // Adatok elmentése a telefon memóriájába
        window.saveMesData = () => {
            const u = document.getElementById('mesUser').value.trim();
            const p = document.getElementById('mesPass').value.trim();
            
            if(!u || !p) {
                if(window.playFeedback) window.playFeedback('error');
                if(window.showToast) window.showToast("Minden mezőt ki kell tölteni a mentéshez!");
                return;
            }
            
            localStorage.setItem('mesData_user', u);
            localStorage.setItem('mesData_pass', p);
            
            if(window.playFeedback) window.playFeedback('success');
            if(window.showToast) window.showToast("Adatok biztonságosan elmentve az eszközre! 🔒");
        };

        // QR kód legenerálása a trükkös formátummal
        window.generateMesQr = () => {
            const u = document.getElementById('mesUser').value.trim();
            const p = document.getElementById('mesPass').value.trim();
            
            if(!u || !p) {
                if(window.playFeedback) window.playFeedback('error');
                if(window.showToast) window.showToast("Kérlek írd be a nevet és a jelszót!");
                return;
            }

            if(window.playFeedback) window.playFeedback('success');
            
            const qrContainer = document.getElementById('mesQrContainer');
            const qrOutput = document.getElementById('mesQrOutput');
            
            // Töröljük az előző kódot
            qrOutput.innerHTML = '';
            
            // A MÁGIA ITT TÖRTÉNIK:
            // \t = Tabulátor gomb a billentyűzeten (átugrik a jelszó mezőre)
            // \r = Enter gomb (leokézza a belépést)
            const qrString = u + "\t" + p + "\r";
            
            // QR kód megrajzolása
            new QRCode(qrOutput, {
                text: qrString,
                width: 218, // Hogy szépen elférjen a belső fehér dobozban
                height: 218,
                correctLevel: QRCode.CorrectLevel.M
            });
            
            // Doboz megjelenítése finom animációval
            qrContainer.classList.remove('hidden');
            qrContainer.style.animation = "slideIn 0.3s ease-out";
        };
    </script>
</body>
</html>
